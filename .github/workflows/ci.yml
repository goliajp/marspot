name: ci

# Every push and every branch: build the whole workspace and run the
# tests.  Nothing here signs or publishes — that is `release.yml`, and
# it runs this same gate again before it does.
#
# One platform today.  Windows and Linux runners join when their
# backends exist; the matrix below is written so adding them is a line
# rather than a rewrite.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS arm64
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          rustc -V

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        # A runner has no display and no keychain.  Tests that need one
        # skip themselves and say so; a test that needs one and does
        # not skip is a bug in the test, not a reason to weaken this.
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Dependency policy
        # Every non-FFI dependency carries a written reason next to it.
        run: bin/lint-deps.sh

      - name: The app bundle assembles
        run: |
          cargo build --release --bins
          bin/build-app-bundle.sh --out "$RUNNER_TEMP/Marspot.app"
          test -x "$RUNNER_TEMP/Marspot.app/Contents/MacOS/marspot-shell"
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                "$RUNNER_TEMP/Marspot.app/Contents/Info.plist")
          cargo_v=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
                    | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "bundle=$v cargo=$cargo_v"
          # The bundle used to report a version from months earlier
          # because its plist was written once and never again.
          [[ "$v" == "$cargo_v" ]] || {
            echo "::error::bundle says $v, the product is $cargo_v" >&2
            exit 1
          }
