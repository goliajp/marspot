name: ci

# Every push and every branch: build the whole workspace and run the
# tests.  Nothing here signs or publishes — that is `release.yml`, and
# it runs this same gate again before it does.
#
# Two legs, and they check different things.
#
# macOS builds and tests the whole product. Linux builds and tests the
# zero-GUI core -- `marspot-term`, which `marspot-session` is made of
# and which a second platform reuses whole. Nothing above that layer
# compiles there yet (Metal, AppKit), so the Linux leg is not a weaker
# copy of the macOS one: it is the only thing that can say the core
# stayed portable.
#
# It can say it because the core did not used to be. Measured
# 2026-10-01: seven errors, four Darwin-only libc calls across three
# files, in the crate documented as the zero-GUI engine. Nobody had
# ever tried. This leg is what stops that happening again silently.

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            name: macOS arm64
            # The whole product.
            scope: --workspace
            nextest: mac
            full: true
          - os: ubuntu-latest
            name: Linux x86_64 (core)
            # Everything above these two is macOS-only today.
            scope: -p marspot-term -p marspot-linkify
            nextest: linux
            full: false
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy
          rustc -V

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Build
        run: cargo build ${{ matrix.scope }} --all-targets

      - name: Test
        # nextest, because that is the gate this project actually runs.
        # `cargo test` puts every test of a binary in one process and
        # runs them on threads, and several of these own a state
        # directory — under threads they land on each other's files and
        # four of them failed here while passing locally.  Per-test
        # processes are not a preference, they are what makes the suite
        # mean the same thing in both places.
        #
        # A runner has no display and no keychain.  Tests that need one
        # skip themselves and say so; a test that needs one and does
        # not skip is a bug in the test, not a reason to weaken this.
        run: |
          curl -LsSf https://get.nexte.st/latest/${{ matrix.nextest }} \
            | tar zxf - -C "$HOME/.cargo/bin"
          cargo nextest run ${{ matrix.scope }} --no-fail-fast

      - name: Clippy
        run: cargo clippy ${{ matrix.scope }} --all-targets -- -D warnings

      # Built from source once and kept, because the alternative is a
      # third-party action fetching binaries into a signing job.
      - name: Cache dependency-policy tools
        if: matrix.full
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ matrix.os }}-deptools-1

      - name: Dependency policy
        if: matrix.full
        # Every non-FFI dependency carries a written reason next to it.
        # Once, not per leg: the policy is about the manifest, and the
        # manifest is the same on both.
        run: |
          for t in cargo-audit cargo-deny cargo-machete; do
            [[ -x "$HOME/.cargo/bin/$t" ]] || cargo install --locked "$t"
          done
          bin/lint-deps.sh

      - name: The app bundle assembles
        if: matrix.full
        run: |
          cargo build --release --bins
          bin/build-app-bundle.sh --out "$RUNNER_TEMP/Marspot.app"
          test -x "$RUNNER_TEMP/Marspot.app/Contents/MacOS/marspot-shell"
          v=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
                "$RUNNER_TEMP/Marspot.app/Contents/Info.plist")
          cargo_v=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
                    | sed -n 's/^version = "\(.*\)"/\1/p' | head -1)
          echo "bundle=$v cargo=$cargo_v"
          # The bundle used to report a version from months earlier
          # because its plist was written once and never again.
          [[ "$v" == "$cargo_v" ]] || {
            echo "::error::bundle says $v, the product is $cargo_v" >&2
            exit 1
          }
