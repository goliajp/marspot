name: site

# Publish the marketing site on every push to develop.
#
# Static, single file, no build step and no dependencies — the same
# posture as the product.
#
# No CNAME file yet on purpose.  Adding one makes Pages take the
# custom domain immediately and redirect the github.io address to it,
# so until DNS points here the site would be unreachable at both
# names.  It goes in when the records do.

on:
  push:
    branches: [develop]
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: The page is what it claims to be
        # Cheap checks that catch the things a static page gets wrong
        # silently: a download link that goes nowhere, a stale version,
        # a title that is still the template's.
        #
        # The download check used to be unconditional, and that is why
        # the site had not deployed since the page started saying there
        # was no build yet: the page was honest, the check demanded a
        # link to something that does not exist, and every run failed
        # on it. The page was live but months old, which is the worst
        # of the three outcomes and the one nobody was told about.
        #
        # What is right depends on whether a release exists, so ask.
        # Both directions are errors: a published build the page does
        # not offer, and an offer of something that is not published --
        # the second is a 404 for whoever clicks it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f site/index.html
          grep -q '<title>Marspot' site/index.html \
            || { echo "::error::the page has no title" >&2; exit 1; }
          # Every absolute link must be https.
          if grep -oE 'href="http://[^"]*"' site/index.html; then
            echo "::error::a plain-http link on the page" >&2
            exit 1
          fi
          released=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          offers=$(grep -c 'releases/latest' site/index.html || true)
          if [[ -n "$released" ]]; then
            [[ "$offers" -gt 0 ]] || {
              echo "::error::$released is published and the page does not offer it" >&2
              exit 1
            }
          else
            [[ "$offers" -eq 0 ]] || {
              echo "::error::the page links to a release; none is published, so that is a 404" >&2
              exit 1
            }
            grep -qi 'no signed build published yet' site/index.html || {
              echo "::error::nothing is published and the page does not say so" >&2
              exit 1
            }
          fi
          echo "release=${released:-none} offers=$offers"

      - uses: actions/configure-pages@v5
        # Turn Pages on rather than asking someone to click it.  The
        # first run failed on exactly this: the site had nowhere to go.
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
