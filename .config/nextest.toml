# No test may run forever.  A test that has not finished in 30 s is
# reported as slow, and one that reaches a minute is killed and fails:
# the slowest test in the suite takes a few seconds, so a minute is a
# hang, not a slow machine.  Before this a wedged test held the runner
# until someone noticed.
#
# A test whose process has exited while something it started still
# holds its stdout or stderr has left a process behind.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
leak-timeout = "200ms"

# Every child these crates' tests start has an owner that kills it, so
# here a leak fails the test; elsewhere it is still only reported.
[[profile.default.overrides]]
filter = 'package(marspot-term) | package(marspot-session) | package(marspot-linkify) | package(marspot)'
leak-timeout = { period = "200ms", result = "fail" }

# A test that asserts a time budget needs the machine to itself.
#
# `b1_perf_1mb_first_64_hits_under_20ms` went red the first time the
# remote runner used one thread per core (2026-09-28): the search still
# worked, it just took longer than 20 ms while thirteen other tests had
# the cores.  The budget is the point of those tests, so the answer is
# not a looser budget — it is that they do not share.
#
# `threads-required = "num-cpus"` makes nextest hold the whole runner
# for one of them at a time.  There are three, each well under a
# second, so the suite pays for it in milliseconds.
[[profile.default.overrides]]
filter = 'test(b1_perf_1mb_first_64_hits_under_20ms) + test(b3_perf_1mb_first_64_hits_under_50ms) + test(the_blank_test_is_cheap_on_a_screen_with_content)'
threads-required = "num-cpus"
