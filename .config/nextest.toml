# No test may run forever.  A test that has not finished in 30 s is
# reported as slow, and one that reaches a minute is killed and fails:
# the slowest test in the suite takes a few seconds, so a minute is a
# hang, not a slow machine.  Before this a wedged test held the runner
# until someone noticed.
#
# A test whose process has exited while something it started still
# holds its stdout or stderr has left a process behind.
#
# Five seconds, not less.  On macOS a test can be reported leaky for
# a few seconds with nothing of its own alive: a unit test that starts
# no process at all was, under a parallel run, and at 200 ms and at 1 s
# leaks came and went with how long the tests running beside it took;
# at 5 s sixty parallel runs of the same tests had none.  The likely
# holder is another test process that inherited the pipe while both
# were being started.  A process a test really leaves behind holds the
# handle for as long as it lives; one that ends within five seconds
# goes unreported, and costs the runner nothing.
[profile.default]
slow-timeout = { period = "30s", terminate-after = 2 }
leak-timeout = "5s"

# Every child these crates' tests start has an owner that kills it, so
# here a leak fails the test; elsewhere it is still only reported.
[[profile.default.overrides]]
filter = 'package(marspot-term) | package(marspot-session) | package(marspot-linkify) | package(marspot)'
leak-timeout = { period = "5s", result = "fail" }

# A test that asserts a time budget needs the machine to itself.
#
# `b1_perf_1mb_first_64_hits_under_20ms` went red the first time the
# remote runner used one thread per core (2026-09-28): the search still
# worked, it just took longer than 20 ms while thirteen other tests had
# the cores.  The budget is the point of those tests, so the answer is
# not a looser budget — it is that they do not share.
#
# The zombie check's budgets are the same kind.  So are the direct-read
# tests of the session: the pty reader lends a flood to the parse loop
# only after megabytes of it with no pause, and a test sharing a small
# runner (the CI's three vCPUs) has its feeding thread taken off its
# core often, which the reader takes for the end of a flood.
#
# `threads-required = "num-cpus"` makes nextest hold the whole runner
# for one of them at a time.  Each takes a few seconds at most, so the
# suite pays for it in tens of seconds.
[[profile.default.overrides]]
filter = 'test(b1_perf_1mb_first_64_hits_under_20ms) + test(b3_perf_1mb_first_64_hits_under_50ms) + test(the_blank_test_is_cheap_on_a_screen_with_content) + test(watch_pending_text_keeps_the_parse_within_five_percent) + binary(perf_gate) + (package(marspot-session) & test(/^local_session::direct::tests::/))'
threads-required = "num-cpus"

# The one test that runs cargo: it builds the session out of a copy
# with no repository.  The copy is kept between runs, so a rebuild is
# of what changed, but after a change to the engine that is the whole
# engine, which can take longer than a minute while other tests share
# the runner.
[[profile.default.overrides]]
filter = 'package(marspot-session) & test(=build_sha_without_repo::a_session_built_without_a_repository_names_the_passed_commit)'
slow-timeout = { period = "60s", terminate-after = 5 }

# The pane plan's closed-loop weeks run a week to a thread and take half
# a minute in a debug build on an idle runner; beside the rest of the
# suite they can pass a minute without hanging.
[[profile.default.overrides]]
filter = 'package(marspot-agent) & test(/closed_loop/)'
slow-timeout = { period = "30s", terminate-after = 4 }

# Each of the closed-loop tests in `loop_tests` starts a thread per week
# and rule, sixteen to forty, so it already uses every core: nextest
# runs it as one that needs them all.  Counted as one thread, two of
# them and the digest ran together with 84 threads on twelve cores, and
# the single-threaded tests beside them were starved:
# `allocation_sim_step4_gate`, 2.9 s alone, passed its minute.  The
# digest is left out: most of its time is one shell-driven week on one
# thread.
[[profile.default.overrides]]
filter = 'package(marspot-agent) & test(/^sched::level2::loop_tests::sched_level2_closed_loop/)'
threads-required = "num-cpus"

# The Linux job on a shared runner: at nice 19 beside a dozen other
# heavy jobs, the scheduler's simulations get a sliver of a core, and
# ones that take 6 to 8 s alone in a debug build passed their minute
# there.  Their limit is ten minutes on that runner; it still ends a
# hang.
[profile.shared-runner]

[[profile.shared-runner.overrides]]
filter = 'package(marspot-agent)'
slow-timeout = { period = "60s", terminate-after = 10 }
