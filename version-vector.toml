死.reattach 失败那条同理改 SIGKILL.signal 语义清晰化:SIGTERM=请你升级(self-execv 或 clean exit) / SIGKILL=立刻死  # L2 — F3+3.2 fix L2 reattach race during 9-L3-simultaneous-execv install storm.根因:L2 cold start 时跑 kill 0 alive_check pass (L3 process 还在),立刻 connect() → L3 已 SHUTDOWN_EXECV 但还在 execv() → from_handoff() 之间,accept loop 尚未 spawn → ECONNREFUSED.过去 connect_with_handshake 一次失败就 prune+spawn fresh,用户看到"少一格".uds_session_client::wait_and_connect 现在 ECONNREFUSED retry 20ms 直到 timeout(2s),让 execv handoff 完成.spawn 路径无影响(brand-new L3 第一次 connect 就成).典型 execv <100ms,install 抢资源时 9 L3 一起 swap 拖到 500ms — 2s 余量充足  # L2 — F3+3.1 SESSION_COUNT_HARD_CAP 9→36 (匹配 LayoutModal GRID_MAX² = 6×6).空 cell 点击 → spawn_session + 落焦点,鼠标一气呵成"增 grid → 填 pane".之前 9 锁死了 Nine 固定 grid 假设,F3+3.0 LayoutModal 给了任意 cols×rows 但 cap 没动 → 用户改 12 cells 后 sidebar [+] 灰 / 空 cell 点击只是 set_focus_to_dead_idx  # L2 — F3+3.0 删 7 项固定 popup picker (Single/SplitH/.../Nine),改成 LayoutModal:任意 cols × rows 的 +/- stepper + Total 行 + Apply 按钮.toolbar layout button 一击切 modal 开/关.modal 关时所有 click 默认行为(grid/sidebar/chrome 都可命中);modal 开时拦截整窗 click,modal 内分发 (Close/Apply/ColsDec/+/RowsDec/+/TitleBar/Frame),click 框外关 modal.shrink-guard:Apply 后若 focused_idx >= new cells_count,focus 落到 last cell.溢出 panes 继续 sidebar fallback.LayoutMode enum + PICKER_LAYOUTS const 全删,grid_dims 现在是 (cols: usize, rows: usize) tuple.Layout.picker_panel_rect / picker_option_rects / picker_option_dims fields + hit_test_picker_option / hit_test_picker_panel methods 全删.GRID_MIN=1 / GRID_MAX=6.layout_modal_state passed to build_instances → push_layout_modal_via_view → paint_layout_modal_content,overlay scratches 走 extra pass 永远在最顶  # L2 — F3+2.1 pane title placeholder 改成被动 OSC 7 链.之前 F3+2 是每帧 proc_pidinfo + entry.toml read,违反"hot path 神圣 zero alloc"原则,PTY 喷流 1-2% CPU 白费.改成:macOS 自带 zsh /etc/zshrc 已注册 OSC 7 hook `\e]7;file://host/path\07` (需 TERM_PROGRAM 非空) → marspot Terminal parser 的 osc_dispatch 解析 → set self.cwd + cwd_dirty=true → L3 publish_and_poke 读 take_cwd_dirty → 发 PaneCwd(54) wire frame → L2 l3_reader_loop decode → CoreEvent::PaneCwd → app.pane_cwds: HashMap<sid, String> 写入.build_views 拿 pane_cwds.get(sid) → Path::file_name 当 placeholder.零 hot-path syscall,event-driven.spawn 时 set TERM_PROGRAM=marspot 让 hook 自动激活
session = "0.9.14"  # L3 — F3+6 LocalSession::spawn 现在读 MARSPOT_INITIAL_CWD env (L2 cold restart 时塞进去),传给 cwd_override 参数 → forkpty 前 chdir 到 user 上次的 workdir,避免每次 fresh spawn 都掉回 $HOME  # L3 — F3+3.6 cwd push-based 链路退役.publish_and_poke 里 take_cwd_dirty / PaneCwd frame 发送移除;Terminal 的 cwd/cwd_dirty fields + osc_dispatch OSC 7 parse + parse_osc7_path/hex_nibble 全删.ZDOTDIR shim 的 __marspot_osc7 函数 + TERM_PROGRAM env 也撤.L2 通过 proc_pidinfo 主动查 cwd,L3 不再有 cwd 这门事  # L3 — F3+3.5 修 scrollback `Disk::push_line` / `Memory::push_line` 在 release build 上的 UB.根因:`debug_assert_eq!(source.len(), self.cols)` 只在 debug 生效,release 直接跑 `copy_nonoverlapping(source.as_ptr(), …, line_bytes)`.当 source 为空 (Vec<Cell> 长度 0) 时 as_ptr() 返回 NonNull::dangling()=align_of::<Cell>()=0x4,memmove 读 line_bytes 字节即在 0x4 SIGSEGV — 精确对应 sid 248 crash report KERN_INVALID_ADDRESS@0x4 in `marspot_term::grid::Grid::push_historic_scrollback_line`.fix:width 不匹配时用 scratch Vec 填 Cell::default() / 截断到 self.cols,确保 copy_nonoverlapping 总有 line_bytes 真实字节.terminal::apply_snapshot 也加 sb_count<=1M / line_cols<=4096 cap,挡掉 corrupt u32 触发巨大 Vec::with_capacity → allocator abort 那条路  # L3 — F3+3.2 marspot-term lib bump (wait_and_connect retry).L3 binary 没改但走同 lib,版本号同步 promote 信号   # L3 — F3+2.2 fix:Apple /etc/zshrc 默认不 source zshrc_Apple_Terminal(那是 Terminal.app 内部加载),所以光设 TERM_PROGRAM 不会自动 activate update_terminal_cwd hook.改成把 OSC 7 hook (__marspot_osc7 func + add-zsh-hook precmd)直接写进 marspot 的 ZDOTDIR shim ~/.cache/marspot/zdot/.zshrc.每个新 pane 的 shell 都自动有 hook.shim init 时也 fire 一次拿到 cwd.F3+2.1 — L3 wire frame PaneCwd(54) + Terminal.cwd_dirty pipeline 保留 OSC 7 → PaneCwd wire.Terminal 加 cwd: Option<String> + cwd_dirty.osc_dispatch 识别 `7;file://host/path`,strip file://,定位首个 `/` 截 path,percent-decode 写入 self.cwd 同时 dirty=true.publish_and_poke 每次都 take_cwd_dirty,真 dirty 时 Frame::new(MsgType::PaneCwd, cwd.as_bytes().to_vec()) 写 control socket.独立于 grid_changed 分支(cd 不一定立刻产 grid 字节).local_session 启 shell 时 set TERM_PROGRAM=marspot 让 macOS /etc/zshrc 的 update_terminal_cwd 自动 hook 上去.parse_osc7_path 容错:无 file:// / 无 host(只 /path) / 路径含 percent-encoding 全 OK,malformed 不 nuke 已知 cwd hot/cold/delete 三层 scrollback.scrollback.bin 当超过 MARSPOT_SCROLLBACK_HOT_CAP_MB(默认 128MB)就 rotate 成 scrollback.cold.bin/.idx(覆盖前任 = "delete"),开新空 hot.cell_at/read_line/wrapped_at fall through cold tier:line_idx >= hot_first_line 走 hot,cold_first_line<= line_idx < hot_first_line 走 cold(pread,不 mmap,低频访问不值得),line_idx < cold_first_line 返 None(已删).total_lines 跨 L3 restart 重置(line_idx per-process,不持久).RAM ring 只装 hot tail.regression test rotation_writes_cold_and_keeps_old_rows_readable(cap=1MB 推 12000 行验证 rotate 发生 + 早行通过 cold 仍可读 + 晚行通过 hot).search 当前只看 hot,cold search 留 F2+6.单 pane 上限 ≤ 256MB,9 pane ≤ 2.3GB(对照之前 54GB)
