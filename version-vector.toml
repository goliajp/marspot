oot 自动 apply_snapshot(state.bin → terminal).前 0.6.64 笔记保留见 git blame.  # 进 alt-screen(claudecode 等 TUI)给 scrollback ring,不再 0.user "在 claudecode 内但是原来我们是可以的啊" — 关 claude 重开后滚出屏幕没法回看.根因 terminal.rs enter_alt_screen 之前 `Grid::with_scrollback(_, _, 0)` 按 VT 严格规范没 scrollback,但 iTerm2/Kitty/Alacritty 全部给 alt 真 ring.fix:alt 用 DEFAULT_SCROLLBACK_LINES(10000)同主屏量.前 0.6.63 笔记保留见 git blame.  # cc 绑定 pane 时同步更新 pane title — user "进入 cc 的时候也要更新 pane title".新 wire MsgType::PaneTitle = 56 + codec(同 PaneBadge,128 字节 cap)+ PluginHost::set_pane_title + PaneSessionHost::set_pane_title + main loop drain + 转发.cc plugin BindMeta 加 project_basename(来自 `pidtree::proc_cwd(claude_pid).file_name`),tick 每轮 idempotent push title "Pn project"(profile)/ "project"(default)— 跟 badge 一起 re-push 兜 L2 respawn.unbound 同步清.前 0.6.62 笔记保留见 git blame.  # AppIcon 调:1) BG 暖橘红渐变 → 黑(#202020→#0C0C0C 轻渐变);2) body 86% → 83.4%(CANVAS_INSET 0.07 → 0.083,介乎 Apple spec 80.5% 跟之前 86% 之间);3) bowtie 内 inset 0.16 → 0.21 缩小一档.shell bump 触发 L1 self-execv 重读 .icns.前 0.6.61 笔记保留见 git blame.  # AppIcon 缩到 80% canvas 跟 macOS 邻居同尺寸 — user 截图 Dock 显示比邻居大很多.之前 squircle 占满 canvas,Apple HIG icon grid spec ~824/1024 = 80.5% 是 visible area,其余 ~10% 透明边距.assets/gen_app_icon.py 加 `CANVAS_INSET_RATIO=0.0975` 应用到 squircle_mask + bowtie 几何同步内推.本次 shell bump 是 no-op code change 触发 L1 self-execv 让 setApplicationIconImage 重读新 .icns(install-local 只比 shell binary hash 决定 stage,Resources/ 变更不触发 re-execv).前 0.6.60 笔记保留见 git blame.  # 0.6.59 set_dock_icon_from_bundle bug fix — `current_exe()` 在 L1 self-execv 后跑在 `~/Library/Caches/marspot/binaries/current/marspot-shell`,不在 .app bundle 里,反推两层 parent 走到 `binaries/` 找不到 Resources/AppIcon.icns silent skip,Dock 不更新.fix:多候选路径试,bundle 反推为先,fallback `$HOME/.local/Marspot.app/Contents/Resources/AppIcon.icns`(已知 install 位置).find 第一个 .exists() 的赢.前 0.6.59 笔记保留见 git blame.  # L1 NSApp 启动主动 setApplicationIconImage(Resources/AppIcon.icns)— macOS Dock 在 launch 时 cache icon,install-local 装新 .icns 不会影响运行中实例的 Dock