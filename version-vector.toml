# Build numbers of the three layers (RFC-003: L4 shelld retired).
#
# The product version -- what the title bar, the About panel, a disk
# image's name and the updater show -- is `[package] version` in
# Cargo.toml, and it moves only through `bin/bump-version.sh`.  The
# numbers below are not it: each is a build number of one binary,
# bumped on every commit that changes that binary's source:
# `bin/install-local.sh` stages only the layers whose number moved, and
# the logs say which build of each layer is running.
#
# Canonical layer numbering (used everywhere -- code, logs, docs):
#
#   L1 = marspot-shell    NSWindow owner / supervisor state machine /
#                         banner / probation logic / shell self-update
#                         path.
#
#   L2 = marspot-core     Renderer (Metal), UI dispatch, layout,
#                         session bootstrap, control-socket protocol
#                         driving, registry-based L3 spawn + reattach
#                         (RFC-003).
#
#   L3 = marspot-session  Per-pane terminal engine + PTY owner: parser,
#                         grid, scrollback, shm publish, UDS control
#                         surface, bytelog.
#
# Bump protocol: bump the version below and put a one-line subject on
# the same line.  The full why/how belongs in the commit message.  Do
# NOT keep appending to this line — it grew to ~25 KB once and ate
# `git diff` readability.

shell   = "0.7.731"  # the placement objective compares accounts over one span, keeps refusals out first, weighs a move by its context and logs its weights; a helper gets Fable only where it takes nothing from the other panes
core    = "0.12.700"  # the process monitor lists what closed panes left running and ends every process by pid and start time
session = "0.11.454"  # a pty the parsing loop gives back dry is lent again on the reader's next full chunk, on the rate taken before, and what the loop read before it found the pty dry counts
