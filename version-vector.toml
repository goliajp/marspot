# Three-layer version vector (RFC-003: L4 shelld retired).  THE
# marspot version is the L2 (core) version — that's what the title
# bar displays and what users mean when they ask "what version of
# marspot are you on?". L1 and L3 each carry their own semver, bumped
# only when their specific code surface changes.
#
# Canonical layer numbering (used everywhere — code, logs, docs):
#
#   L1 = marspot-shell    NSWindow owner / supervisor state machine /
#                         banner / probation logic / shell self-update
#                         path. Stable wrapper; bump rarely.
#
#   L2 = marspot-core     THE marspot version. Renderer (Metal), UI
#                         dispatch, layout, session bootstrap, control-
#                         socket protocol driving, registry-based L3
#                         spawn + reattach (RFC-003). Bump on every
#                         user-visible release.
#
#   L3 = marspot-session  Per-pane terminal engine + PTY owner: parser,
#                         grid, scrollback, shm publish, UDS control
#                         surface, bytelog.  Bump when in-process
#                         terminal mechanics or the L2↔L3 wire change.

shell   = "0.6.1"    # L1 — F2+2a claudecode 插件 `attach_raw_only` 永久 Unsupported 之后插 `monitor_unsupported` latch,一次 fail 就停止重试.之前 9 pane × 0.5Hz tick = 4.5/s `monitor.attach_failed` Warn 占 94% log 总量;现在静音.同步 F2+2b 把 install-local.sh 里 RFC-003 已退役 L4 shelld 的 LaunchAgent bootstrap 块改成 retirement 注释(`install-shelld.sh` 本就不存在,verdict_sum=0 分支早就坏)
core    = "0.10.33"  # L2 — F3+2.1 pane title placeholder 改成被动 OSC 7 链.之前 F3+2 是每帧 proc_pidinfo + entry.toml read,违反"hot path 神圣 zero alloc"原则,PTY 喷流 1-2% CPU 白费.改成:macOS 自带 zsh /etc/zshrc 已注册 OSC 7 hook `\e]7;file://host/path\07` (需 TERM_PROGRAM 非空) → marspot Terminal parser 的 osc_dispatch 解析 → set self.cwd + cwd_dirty=true → L3 publish_and_poke 读 take_cwd_dirty → 发 PaneCwd(54) wire frame → L2 l3_reader_loop decode → CoreEvent::PaneCwd → app.pane_cwds: HashMap<sid, String> 写入.build_views 拿 pane_cwds.get(sid) → Path::file_name 当 placeholder.零 hot-path syscall,event-driven.spawn 时 set TERM_PROGRAM=marspot 让 hook 自动激活
session = "0.9.10"   # L3 — F3+2.2 fix:Apple /etc/zshrc 默认不 source zshrc_Apple_Terminal(那是 Terminal.app 内部加载),所以光设 TERM_PROGRAM 不会自动 activate update_terminal_cwd hook.改成把 OSC 7 hook (__marspot_osc7 func + add-zsh-hook precmd)直接写进 marspot 的 ZDOTDIR shim ~/.cache/marspot/zdot/.zshrc.每个新 pane 的 shell 都自动有 hook.shim init 时也 fire 一次拿到 cwd.F3+2.1 — L3 wire frame PaneCwd(54) + Terminal.cwd_dirty pipeline 保留 OSC 7 → PaneCwd wire.Terminal 加 cwd: Option<String> + cwd_dirty.osc_dispatch 识别 `7;file://host/path`,strip file://,定位首个 `/` 截 path,percent-decode 写入 self.cwd 同时 dirty=true.publish_and_poke 每次都 take_cwd_dirty,真 dirty 时 Frame::new(MsgType::PaneCwd, cwd.as_bytes().to_vec()) 写 control socket.独立于 grid_changed 分支(cd 不一定立刻产 grid 字节).local_session 启 shell 时 set TERM_PROGRAM=marspot 让 macOS /etc/zshrc 的 update_terminal_cwd 自动 hook 上去.parse_osc7_path 容错:无 file:// / 无 host(只 /path) / 路径含 percent-encoding 全 OK,malformed 不 nuke 已知 cwd hot/cold/delete 三层 scrollback.scrollback.bin 当超过 MARSPOT_SCROLLBACK_HOT_CAP_MB(默认 128MB)就 rotate 成 scrollback.cold.bin/.idx(覆盖前任 = "delete"),开新空 hot.cell_at/read_line/wrapped_at fall through cold tier:line_idx >= hot_first_line 走 hot,cold_first_line<= line_idx < hot_first_line 走 cold(pread,不 mmap,低频访问不值得),line_idx < cold_first_line 返 None(已删).total_lines 跨 L3 restart 重置(line_idx per-process,不持久).RAM ring 只装 hot tail.regression test rotation_writes_cold_and_keeps_old_rows_readable(cap=1MB 推 12000 行验证 rotate 发生 + 早行通过 cold 仍可读 + 晚行通过 hot).search 当前只看 hot,cold search 留 F2+6.单 pane 上限 ≤ 256MB,9 pane ≤ 2.3GB(对照之前 54GB)
