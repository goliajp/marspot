# Three-layer version vector (RFC-003: L4 shelld retired).  THE
# marspot version is the L2 (core) version — that's what the title
# bar displays and what users mean when they ask "what version of
# marspot are you on?". L1 and L3 each carry their own semver, bumped
# only when their specific code surface changes.
#
# Canonical layer numbering (used everywhere — code, logs, docs):
#
#   L1 = marspot-shell    NSWindow owner / supervisor state machine /
#                         banner / probation logic / shell self-update
#                         path. Stable wrapper; bump rarely.
#
#   L2 = marspot-core     THE marspot version. Renderer (Metal), UI
#                         dispatch, layout, session bootstrap, control-
#                         socket protocol driving, registry-based L3
#                         spawn + reattach (RFC-003). Bump on every
#                         user-visible release.
#
#   L3 = marspot-session  Per-pane terminal engine + PTY owner: parser,
#                         grid, scrollback, shm publish, UDS control
#                         surface, bytelog.  Bump when in-process
#                         terminal mechanics or the L2↔L3 wire change.

shell   = "0.6.2"  # L1 — F3+6.1 NSWindow 位置/尺寸/所在屏幕持久化.独立 window-state.bin (MAGIC 0xA5505011, VERSION 1) 让 L1 自管,避开和 L2 shell-state.bin 写 race.boot:env MARSPOT_RESTORE_FRAME (L1 self-execv 路径) → state::read_window() (cold boot) → WindowAttrs.frame_pt;w/h ≤ 50pt 丢弃防 corrupt 把窗口缩成一条缝.MarspotApp trait 新加 fn moved(_ctx),NSWindowDelegate windowDidMove: dispatch → EventKind::Moved → app.moved(ctx).ShellApp::resized + ShellApp::moved 都 save_window_state(ctx):ctx.window_frame_pt() + ctx.window_display_id() (新加 [NSWindow screen].deviceDescription[NSScreenNumber] → u32 CGDirectDisplayID).每次写 ~50us atomic .tmp+rename,live drag 60+ 写/s 仍 OK    # L1 — F2+2a claudecode 插件 `attach_raw_only` 永久 Unsupported 之后插 `monitor_unsupported` latch,一次 fail 就停止重试.之前 9 pane × 0.5Hz tick = 4.5/s `monitor.attach_failed` Warn 占 94% log 总量;现在静音.同步 F2+2b 把 install-local.sh 里 RFC-003 已退役 L4 shelld 的 LaunchAgent bootstrap 块改成 retirement 注释(`install-shelld.sh` 本就不存在,verdict_sum=0 分支早就坏)
core    = "0.10.46"  # L2 — F3+6 session 持久化:~/Library/Caches/marspot/shell-state.bin (MAGIC=0xA5505010, VERSION=1, atomic .tmp+rename).新 src/state.rs 模块 LE-binary 编码 grid_cols/rows + focused_idx + pane_count + per-pane (sid, custom_title, last_cwd) + (reserved) window frame for F3+6.1.MAX_PANES=128 / MAX_STR_BYTES=4096 防 OOM trigger.3 个 round-trip / bad-magic / runaway-pane-count unit test.5 个 save trigger:spawn_session / close_session / commit_title_edit / LayoutModal Apply / boot 末尾.Boot 路径:state::read() 决定 grid_cols/rows + n_sessions;alive_ids 按 saved.panes 顺序 reorder,saved 没记的 alive id 排到尾后续 SIGKILL 清掉;fresh-spawn 那条用 saved 的 last_cwd 走新的 spawn_l3_pane_with_cwd(initial_cwd) → MARSPOT_INITIAL_CWD env → L3 main.rs 读 → LocalSession::spawn(cwd_override=&path) chdir before forkpty.custom_titles_init 优先 saved.panes.custom_title,fallback entry.toml session_titles.focused_idx 从 saved 恢复并 clamp 到 panes.len()-1.MARSPOT_STATE_DIR env 仍走 dev sandbox.window 字段 reserved 但 None until F3+6.1 wire L1 NSWindow frame  # L2 — F3+5.1 fix latent bug:refresh_pane_cwd_for 失败路径不更新 last_cwd_refresh,build_views 的 lazy_fill 用 force=true → 任何永远抓不到 cwd 的 pane (entry.toml 缺 shell_child_pid / sandbox 挡 proc_pidinfo / pane 刚 spawn 那几毫秒) 都每帧 force retry,60 fps × N × ~15us = 0.8% CPU 白送.fix:① refresh_pane_cwd_for 在 syscall 之前就 last_cwd_refresh.insert(sid, now),success/fail 都进 debounce 时钟 ② lazy_fill 改 force=false,跟新 debounce 配对 — 失败 pane 最多每 CWD_REFRESH_DEBOUNCE 重试一次.steady state 全 contains_key 命中,跟之前一样  # L2 — F3+5 pane title cwd 改 hybrid 被动+懒填,5 个 trigger 零轮询:① pane spawn 时 refresh_pane_cwd_for(new_idx, force=true) ② mouse_down focus 切到新 pane 时 (focused_idx 变化) refresh_pane_cwd_for(idx, force=false 走 150ms debounce) ③ key_event 字节含 \r 或 \n (Enter / Return)到 focused pane 时 refresh_pane_cwd_for(focused, false) ④ LayoutModal 打开仍走 refresh_pane_cwds 全 pane 批量 ⑤ build_views 头调 lazy_fill_missing_cwds() — 任何 sid 没在 pane_cwds 就当场抓一次,steady-state 全 cache hit 不进 syscall.CWD_REFRESH_DEBOUNCE=150ms HashMap<sid, Instant> last_cwd_refresh dedup 多行粘贴 N 个 Enter 收成 1 个 syscall.close_session 时清 pane_cwds + last_cwd_refresh + pane_badges per-sid 防泄漏.idle 0 syscall/s,active 打字 < 1 syscall/s,title 一直可用  # L2 — F3+4.1 新 Table 组件 + Process Monitor 切到 Table.src/ui/components/table.rs 新组件:TableColumn (width: Px(f64)|Flex(f64), align: Alignment, sort: Option<SortDir>, sortable: bool) + TableRow {cells: Vec<String>, depth: u8, kind: Data|Section} + TableStyle (header_bg/fg + row_bg/alt/selected + fg/section_fg).API:Table::paint(p), column_x_widths(), row_rect(i), body_rect(), hit_test_row(x,y), hit_test_header(x,y).devops-grade:Flex/Px 列混排、列对齐、tree-style depth indent、sort 指示 ▲/▼、section row 不可选.3 个 unit test 验证 flex 分配/hit_test 边界/header sortable 过滤.Process Monitor master + detail 都用 Table 实例渲染,kill[×] 叠在 detail 最后一列 cell 上.row_h/header_h 一组样式集中在 TableStyle 默认 sane defaults,marspot 配 PROCESS_PANEL_* 色板覆盖  # L2 — F3+4 Process Monitor 大重写,信息+UI 专业化.tabs 死亡 → master/detail.master 列 (left 38%):pane name(custom>cwd basename>序号) / #pids / CPU% / RSS,按 CPU% 降序排.detail 列 (right 62%):选中 pane 的进程树,缩进=depth,列 comm/pid/CPU%/RSS+×.新加 pidtree::proc_stat(PROC_PIDTASKINFO) → 拿 rss_bytes + total_cpu_ns + threads;refresh_process_panel 每 2s 跑一遍 walk 所有 pane 的 pid 树,sample 当前 stats,prev_pid_stats HashMap delta 出 CPU%,把 aggregate (n_pids/cpu_pct/rss_kb/busy) 存到 PanePidTree.master 行 hit_test 切 selected_pane.column header 用 ViewPainter::text_in + Alignment::CenterRight 拍齐数字列.ProcessPanelRow 新字段 pid/comm/cpu_pct/rss_kb 替代原 text.kill[×] 不变,scroll 仍只 detail 列.format_rss helper KB→K/M/G  # L2 — F3+3.7 LayoutModal 加大 + card 加大 + grid 居中.MODAL_W 320→440 / MODAL_MIN_H 280→380 / CARD_MIN_W 44→80 / CARD_MIN_H 32→56 / CARD_GAP 6→8.原 card_grid_pad 删了,改用 Rect::place(card_block_w, card_block_h, Alignment::Center) 把 card block 居中放进 row2 底部到 total_label 顶部的 region — 任何 vertical flex 平均落在 cards 上下,而不是堆在 modal 下半.原来 cwd 短 (8-9 chars) 就能塞下,但典型 workdir basename 10-15 chars 会被裁;新 size + Alignment helper 一并解决# L2 — F3+3.6 撤掉