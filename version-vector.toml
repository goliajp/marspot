session = "0.11.22"  # 共享 crate(shell_proto WindowOpenRequest=64)重链接.前 0.11.21 复活的会话不再把旧进程的终端模式套在新 shell 上 —— 鼠标追踪残留会让滚轮变成 `CSI < 64;x;y M` 打进 zsh 提示符("command not found: 29M64").前 0.11.20 共享 crate(shell_proto window_id)重链接.前 0.11.19 主循环看门狗 + 共享 crate 重链接.前 0.11.18 共享 crate(StallReport::summary)重链接.前 0.11.17 共享 crate(握手超时受 deadline 约束)重链接.前 0.11.16 PtyWriter 退化成 BoundedWriter 特化 + SnapshotWriter 独立成模块.前 0.11.15 快照写盘不再白拷一份 body 只为打日志;队列容量改引用共享 cap.前 0.11.14 共享 crate(uds_session_client 单一 deadline)重链接.前 0.11.13 周期快照的写盘搬出主循环 — 现场实测 115KB 快照在磁盘忙时写了 2.87 秒,整条循环冻住.前 0.11.12 FrameWriter 提到共享 crate(ControlWriter 改为薄封装)+ .next_id 非阻塞 flock 重链接.前 0.11.11 控制 socket 写搬出主循环(实测 macOS AF_UNIX SO_SNDBUF 仅 8192,L2 一停读 L3 主循环即钉死)+ 主循环停顿探测器 l3.loop.stall.前 0.11.10 bytelog 轮转取代拷贝压缩(共享 crate 重链接)— 越过 100MB 上限时不再在主循环上拷 50MB,现场实测冻住 pane 10 秒以上;改为一次 rename.前 0.11.9 PTY 写路径搬出主循环 — raw 模式子进程不读 stdin 时 write(2) 阻塞整条 L3 主循环(单 pane 卡输入数分钟后自愈的根因);改为专用 writer 线程 + 256KB 有界队列 + 短写补齐.前 0.11.8 共享 crate(layout)重链接.前 0.11.7 linkify 孵化重链接.前 0.11.4 CSI 3J 清到持久层 — clear 后重启不再复活历史;hot pair 截断 + cold 删除 + mmap 失效,bytelog 不动(重放会重现同一 3J).前 0.11.3 v5 live 验证轮 — execv 场景 alt 屏原样恢复(fold 语义误用导致输入框消失/重绘慢的现场回归修复)+ execv 恢复后 SIGWINCH 前台进程组兜底.前 0.11.1 C.1 快照升 INFO — session 目录 flock(A.3)、周期快照 30s 防抖(C.1,硬宕机窗口有界)、快照 v4 alt 折叠(B13)+ B14 tail 序反修复、scrollback 损坏隔离重建(A.4)、.next_id 自愈(A.1)、Drop 去毁灭化.前 0.10.21 笔记见 git blame.
