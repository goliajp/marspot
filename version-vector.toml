# Three-layer version vector (RFC-003: L4 shelld retired).  THE
# marspot version is the L2 (core) version — that's what the title
# bar displays and what users mean when they ask "what version of
# marspot are you on?". L1 and L3 each carry their own semver, bumped
# only when their specific code surface changes.
#
# Canonical layer numbering (used everywhere — code, logs, docs):
#
#   L1 = marspot-shell    NSWindow owner / supervisor state machine /
#                         banner / probation logic / shell self-update
#                         path. Stable wrapper; bump rarely.
#
#   L2 = marspot-core     THE marspot version. Renderer (Metal), UI
#                         dispatch, layout, session bootstrap, control-
#                         socket protocol driving, registry-based L3
#                         spawn + reattach (RFC-003). Bump on every
#                         user-visible release.
#
#   L3 = marspot-session  Per-pane terminal engine + PTY owner: parser,
#                         grid, scrollback, shm publish, UDS control
#                         surface, bytelog.  Bump when in-process
#                         terminal mechanics or the L2↔L3 wire change.
#
# Bump protocol: bump the version below, then add ONE entry to the
# matching section in CHANGELOG.md (newest on top).  The trailing `#`
# subject here is the one-line summary; full why/how lives in the
# commit message and in CHANGELOG.md.  Do NOT keep appending to this
# line — that grew to ~25 KB before and ate `git diff` readability.

shell   = "0.6.27"  # B0.7 真 font 分离 — chrome 走系统 UI font(SF Pro),PTY 仍 mono;FontCache 加 ui_font_idx + ui_cell_w/h/ascent,resolve_char_ui CJK fallback,push_text_run_kind(FontKind::Terminal|Ui)per-glyph CT advance
core    = "0.10.77" # encode_canvas_into 加 ui_font: bool 参数,dev_window + main 渲染 chrome path 都传 true
session = "0.9.23"  # marspot-term 撤 blank-skip 一并进 L3
