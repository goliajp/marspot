# Three-layer version vector + daemon. The marspot "software" version
# is the L2 (core) version — that's what the title bar displays and
# what users mean when they ask "what version of marspot are you on?".
#
# L1 (shell), L3 (session), and the shelld daemon each carry their own
# version, bumped only when their specific code surface changes — far
# less often than L2's render + UI + input churn.
#
# Conventions:
#
#   shell    L1. NSWindow owner / supervisor state machine / banner /
#            probation logic / shell self-update path. Bump rarely.
#
#   core     L2. THE marspot version. Renderer, UI dispatch, layout,
#            session bootstrap, control-socket protocol driving. Bump
#            on every release.
#
#   session  L3. Per-pane terminal engine: parser, grid, scrollback,
#            shm publish, control reply. Bump when the in-process
#            terminal mechanics change.
#
#   shelld   The PTY daemon. Bump when bytelog format, SIGUSR1 execv
#            mechanics, or session table semantics change.

shell   = "0.2.1"
core    = "0.2.13"
session = "0.2.5"
shelld  = "0.2.3"
