# Three-layer version vector (RFC-003: L4 shelld retired).  THE
# marspot version is the L2 (core) version — that's what the title
# bar displays and what users mean when they ask "what version of
# marspot are you on?". L1 and L3 each carry their own semver, bumped
# only when their specific code surface changes.
#
# Canonical layer numbering (used everywhere — code, logs, docs):
#
#   L1 = marspot-shell    NSWindow owner / supervisor state machine /
#                         banner / probation logic / shell self-update
#                         path. Stable wrapper; bump rarely.
#
#   L2 = marspot-core     THE marspot version. Renderer (Metal), UI
#                         dispatch, layout, session bootstrap, control-
#                         socket protocol driving, registry-based L3
#                         spawn + reattach (RFC-003). Bump on every
#                         user-visible release.
#
#   L3 = marspot-session  Per-pane terminal engine + PTY owner: parser,
#                         grid, scrollback, shm publish, UDS control
#                         surface, bytelog.  Bump when in-process
#                         terminal mechanics or the L2↔L3 wire change.
#
# Bump protocol: bump the version below, then add ONE entry to the
# matching section in CHANGELOG.md (newest on top).  The trailing `#`
# subject here is the one-line summary; full why/how lives in the
# commit message and in CHANGELOG.md.  Do NOT keep appending to this
# line — that grew to ~25 KB before and ate `git diff` readability.

shell   = "0.7.16"  # RFC-005 平权审计:core 热替换/崩溃重启后按窗口重放 SurfaceAttachWindow(原来只有启动窗口的 pair 进得去新 core,其余窗口从此没人画、pane 被当孤儿收进第一个窗口)、复原请求只认本次启动的第一个 core(否则替换 core 会把已经开着的窗口再开一遍)、banner 推给所有窗口的 presenter(原来只有第一个响应回调的窗口显示/清除)、stale-present 兜底改成每窗口(原来全局,一个 60Hz 刷的窗口让别的窗口永远不显得 stale).前 0.7.15 RFC-005 步骤 6b — 收 WindowOpenRequest 复原窗口:按 window-state.bin 的第 N 条几何开窗(索引越界不算错,退回默认矩形);开窗路径与 Cmd-N 合流成 open_window_with_frame;新窗口一诞生就把自己的 frame 播种进几何缓存,列表里不留洞.前 0.7.14 RFC-005 步骤 6a — window-state.bin v2:按创建序存所有窗口的 frame(原来是单帧,谁最后动谁赢,其它窗口的几何直接丢);v1 文件读成一元列表.前 0.7.13 Cmd-N 崩溃修复 — 开/关窗口改走延迟队列(事件处理器都跑在 app-state 借用里,直接动它必 panic);surface 改在窗口真正存在后按它自己的度量创建.前 0.7.12 RFC-005 步骤 4c — Cmd-N 开新窗口(L1 拥有窗口,自己拦截不绕 core)+ 关窗只关那一个窗口、最后一窗才退出;每窗口自带 surface pair.前 0.7.11 自更新先验证后继者能起来再 exec —— 起不来就隔离,不再拿整个应用去赌(7/26 事故:adhoc 签名的后继者被 AMFI 杀,GUI 连同 16 个会话一起消失,日志全空).前 0.7.10 RFC-005 步骤 4b — surface 对/presenter/首帧闸门收进 ShellWindow(每窗口一份);SurfaceReady 按 surface id 反查窗口,这正是它不需要在 wire 上带 window_id 的原因.前 0.7.9 RFC-005 步骤 4a — 事件按窗口路由:view/delegate 带 window_id,ctx 即窗口身份,输入帧的 window_id 从 ctx 取(不再是常量).前 0.7.8 RFC-005 步骤 2 — 输入帧带 window_id,attach 走新旧双发.前 0.7.7 cc @model 切 profile 后不再显示旧模型 — 按 claude pid 变更设读取围栏.前 0.7.6 共享 crate(layout 第 5 钮)重链接.前 0.7.5 DevPanel 冷启动永远隐藏 — 不再恢复持久化的 visible(一次调试开过就每次自启的烦恼);位置尺寸照旧恢复,toolbar 第 4 icon 召唤.前 0.7.1 snapshot v5 重链接.前 0.7.0 RFC-004 D.1 — L1 入口跑 migrate_legacy_state_root(Caches → Application Support,rename+symlink 一次性迁移).前 0.6.88 笔记见 git blame.
core    = "0.12.47"  # RFC-005 平权审计:hover 改在 render 里按窗口发布(原来在命中测试时推给共享 renderer,A 的悬停画到 B 的工具栏)、cc 用量面板收进 WindowState(原来一开开在所有窗口)、Esc×3 逃生口按 session 计数(原来全局,一个 pane 的按键能替另一个凑数)、启动装配加 reserved_sids(core 热替换时启动窗口会把还没被宣告的其它窗口的活会话当孤儿收养,紧接着那个窗口自己又要 reattach 同一批).前 0.12.46 RFC-005 步骤 4e — 输入路径平权:每个 CoreEvent 带 L1 打上的 window_id,按事件种类各自决定归属(按下/右键/拖放=落点窗口并取焦点;滚轮/移动=光标所在窗口不改焦点;拖拽/松开=按下时那个窗口;按键/预编辑=键入的那个窗口;应用级 focus=所有窗口;badge/title/PaneSession/注入输入=持有该 sid 的窗口;进程面板每窗口各自 tick).认不出的窗口一律丢弃,不回落 key window.前 0.12.45 RFC-005 步骤 6b — 复原上次的 N 个窗口:启动时按保存记录请求 L1 开窗(新帧 WindowOpenRequest=64,老 reader 静默跳过,不 bump PROTO),窗口先带自己的网格与"starting…"占位出现,装配走 worker 线程(reattach 会阻塞在 UDS 握手上,开窗不能冻住已有窗口);复原装配不扫 registry(否则会把别的窗口的会话再收养一遍、把不认识的目录退休);off-loop 结果(spawn 完成/控制流重连/搜索结果)改成按 sid 找遍所有窗口 —— 原来只找 key window,焦点一换就静默丢弃.前 0.12.44 RFC-005 步骤 6a — shell-state.bin v2:窗口列表 + key_window,save 写全部窗口(原来只写 key window 的 panes —— 开第二个窗口的瞬间它就成了 key,16 个 pane 的记录被 1 个覆盖);v1 文件读成单窗口.前 0.12.43 RFC-005 步骤 4d — 窗口平权(泵与画):每个窗口自持 IOSurface 对/纹理/写入半区/帧间隔闸,attach 按 window_id 路由,渲染遍历所有脏窗口;pump 与搜索去抖走全部窗口(非 key 窗口的 pane 原本一个字节都收不到),退出条件改成"所有窗口的所有 pane 都退了".前 0.12.42 RFC-005 步骤 4c — 认领新窗口:带着没见过的 window_id 的 attach 帧就是那个窗口的出生证,建 1×1 网格 + 一个 off-loop 新 pane.前 0.12.41 修 --log-event 从未实现 — install-local 的 sup_log 每次调用都 panic(每次安装 3 个死进程,零日志);那是 2026-06-15 丢 9 个 session 后加的可见性机制,一直是坏的.前 0.12.40 RFC-005 步骤 3 — renderer 拆分:pane 实例缓存与"欠清屏"标志归 WindowRender(每窗口一份),device/pipeline/字体/两个 atlas/所有 scratch 全共享;实测 atlas 不需要按 scale 分组.前 0.12.39 RFC-005 步骤 2 — wire 带 window_id + 窗口生命周期帧(不 bump PROTO_VERSION:版本不等会被 L1 杀 core).前 0.12.38 RFC-005 步骤 1 — 窗口态从 CoreApp 收编进 WindowState(windows: Vec + key_window),访问走 win! 宏保持字段路径以免借用冲突;单窗口行为零变化.前 0.12.37 custom_title 收进 Pane — 标题成为 pane 的字段随 pane 走,消灭平行数组手工同步;boot 回绑并入 assemble_panes_at_boot(可测).前 0.12.36 cc 账户按名字里的序号排(1→4),不再跟 collector 的完成顺序;卡片与时间轴同源.前 0.12.35 交通灯绘制收成一条路径(组件与面板不再各画一份),hover 标记随之对所有自绘标题栏生效.前 0.12.34 hover 图标掩码直接从系统按钮的截图提取(不再手抄形状)+ 宽高分离居中 + 整像素对齐.前 0.12.33 hover 图标改按像素掩码画(字形尺寸/基线都对不准:实测我们的 ✕ 是 6x11,原生 6x6).前 0.12.32 交通灯不再按字号缩放(scale_hint 是 cell_h/20,15 被缩成 12);改为绘制 core 算好的矩形,热区与圆点从此同源.前 0.12.31 交通灯 hover 显 ×/−/+ 图标,跟系统一致(悬停标题栏三个都显,不是单个).前 0.12.30 Process Monitor 的交通灯原来是第三份手写副本(自带常量+自带描边),前两轮改的组件它压根不调用;现在共用唯一出处.前 0.12.29 交通灯去掉内侧描边 —— 它是 alpha 修复后才显形的,从内侧啃掉每边 1px;实测原生 14px 我们只剩 9px.前 0.12.28 Process Monitor 四边补内边距(内容不再贴边/溢出)+ 绘制与热区共用同一套几何常量.前 0.12.27 主循环看门狗 — 冻结进行时就报告,不必等迭代结束.前 0.12.26 低优先级收尾 — L2 停顿阈值改具名常量、attach 分支 phase 改名避免同迭代重名、spawn 死参数删除、失败路也走 adopt_backend、交通灯测试从常量推导.前 0.12.25 cc modal 几何独立成 ui/components/cc_usage_modal(具名 metric + 卡高推导 + 面板 rect),painter 只管画 —— 与 layout_modal 的分层惯例对齐.前 0.12.24 ShapeCache 文档归位;共享 crate(握手超时受 deadline 约束、bytelog 恢复工具跨轮转段)重链接.前 0.12.23 四个 writer 收敛到一个 BoundedWriter<T> + SnapshotWriter 独立成模块.前 0.12.22 队列容量四处收成一处(frame_writer::cap)+ 快照不再为打日志白拷 100-300KB.前 0.12.21 pending 槽加超时逃生口(worker 丢了不再锁死复活路径)+ 补 pane/LRU 回归测试(旧的分辨不出 LRU 与 FIFO)+ font_cache 文档与字段名对齐实现.前 0.12.20 自审收口 — 修重连后 Cmd-C 静默失效(swap_control 漏换 selection_rx)+ 常量文档串位 + 删测试专用包装 + L3 停顿探测器拆细 phase + L2 写失败样板 6→1.前 0.12.19 交通灯 14pt 追平原生 + mouse-tracking TUI 滚动清选区(claudecode 里滚一下选区不再罩错内容).前 0.12.18 cc modal 两个 section header 改用系统 UI 字体(SF Pro 系统字号),与原生 header 同尺寸,不再是终端等宽小一号;ViewPainter 补 ui_text 比例字体原语.前 0.12.17 cc 卡片四边同一 padding + 卡高由内容推导 + chip 文字按 ink 垂直居中.前 0.12.16 cc modal 版式放宽(卡片内边距 / 两段间距 / OK 与百分比右对齐)+ 建 pane 搬出主循环 + wait_and_connect 调用方预算显式化.前 0.12.15 阻塞面收口 — L2→L3 每条控制流走 FrameWriter(一个卡住的 L3 不再锁死整个 L2)+ 阴影层预乘修正 + wait_and_connect 单一 deadline(原来是 2×).前 0.12.14 cc 时间轴右侧留标签槽 — 窗口条的 tag 不再压在 modal 边框上;轴按最宽 tag 收窄,面板同步加宽补回分辨率.前 0.12.13 ui_rect 混合因子修正(着色器输出预乘,源因子却是 SourceAlpha,alpha 被乘两遍 —— 半透明填充一直不可见)+ 主循环阶段名细分.前 0.12.12 cc 时间轴日期改虚线贯穿图表 — 日期不再只在轴下当标签,每天一条淡虚线上到图里,条的端点可以就地对着日期读;NOW 保持实线做对比.前 0.12.11 L2 主循环根治阻塞 — 重连搬线程 / 写 L1 走 FrameWriter / ShapeCache 计数戳 LRU / cwd 负缓存 / .next_id 非阻塞 flock / font_cache 逐条驱逐 + l2.loop.stall 停顿探测.前 0.12.10 Cmd+Shift+C 开关 Cc usage modal(排在 Cmd-C 复制之前,否则被当成复制吞掉;也排在 LOCK_KEYS 之前,claudecode 占键盘时照样能开).前 0.12.9 Cc modal 视觉