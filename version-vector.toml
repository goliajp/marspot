# Four-layer version vector. THE marspot version is the L2 (core)
# version — that's what the title bar displays and what users mean
# when they ask "what version of marspot are you on?". L1 / L3 / L4
# each carry their own semver, bumped only when their specific code
# surface changes.
#
# Canonical layer numbering (used everywhere — code, logs, docs):
#
#   L1 = marspot-shell    NSWindow owner / supervisor state machine /
#                         banner / probation logic / shell self-update
#                         path. Stable wrapper; bump rarely.
#
#   L2 = marspot-core     THE marspot version. Renderer (Metal), UI
#                         dispatch, layout, session bootstrap, control-
#                         socket protocol driving. Bump on every
#                         user-visible release.
#
#   L3 = marspot-session  Per-pane terminal engine: parser, grid,
#                         scrollback, shm publish, control reply. Bump
#                         when in-process terminal mechanics change.
#
#   L4 = marspot-shelld   The PTY daemon. Bump when bytelog format,
#                         SIGUSR1 execv mechanics, or session table
#                         semantics change.

shell   = "0.2.1"    # L1
core    = "0.2.16"   # L2 — marspot version
session = "0.2.5"    # L3
shelld  = "0.2.3"    # L4
