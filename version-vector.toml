# Three-layer version vector (RFC-003: L4 shelld retired).  THE
# marspot version is the L2 (core) version — that's what the title
# bar displays and what users mean when they ask "what version of
# marspot are you on?". L1 and L3 each carry their own semver, bumped
# only when their specific code surface changes.
#
# Canonical layer numbering (used everywhere — code, logs, docs):
#
#   L1 = marspot-shell    NSWindow owner / supervisor state machine /
#                         banner / probation logic / shell self-update
#                         path. Stable wrapper; bump rarely.
#
#   L2 = marspot-core     THE marspot version. Renderer (Metal), UI
#                         dispatch, layout, session bootstrap, control-
#                         socket protocol driving, registry-based L3
#                         spawn + reattach (RFC-003). Bump on every
#                         user-visible release.
#
#   L3 = marspot-session  Per-pane terminal engine + PTY owner: parser,
#                         grid, scrollback, shm publish, UDS control
#                         surface, bytelog.  Bump when in-process
#                         terminal mechanics or the L2↔L3 wire change.

shell   = "0.6.1"    # L1 — F2+2a claudecode 插件 `attach_raw_only` 永久 Unsupported 之后插 `monitor_unsupported` latch,一次 fail 就停止重试.之前 9 pane × 0.5Hz tick = 4.5/s `monitor.attach_failed` Warn 占 94% log 总量;现在静音.同步 F2+2b 把 install-local.sh 里 RFC-003 已退役 L4 shelld 的 LaunchAgent bootstrap 块改成 retirement 注释(`install-shelld.sh` 本就不存在,verdict_sum=0 分支早就坏)
core    = "0.10.13"  # L2 — F1+13 perf 三连:(1) 加 PaneInstanceCache per-pane fingerprint hit→memcpy slice skip push_session.fingerprint 哈 grid seq + view 字段 + 两套 atlas rebuild_count,任意一项变就 rebuild + snapshot.目标 9-claudecode idle frame L2 从 22% 砍掉一大块;(2) overlay_mask 早返回守不进 closure;(3) SessionView 加 seq 字段, Pane::as_view 填 L3 mirror last_seq(Local 退化用 cursor + scroll_push 拼)
session = "0.9.6"    # L3 — F2+3 BUGFIX: FileScrollback::cell_at mmap 主路径之前用 `cells.into_iter().next()` 不分 col 永远拿 cell 0,导致离开 RAM ring 的老 scrollback 渲染时每行变成"首字符重复 N 列".A2 cold-read 三档(cf0bd362,今天 09:25)引入,F1+13 RAM ring 1024→256 让 mmap 路径成日常 → 用户看到 9 pane 老 history 全成 "eeeee/aaaaa" 那种乱码.文件本身没坏,只是读路径错;改成 `cells.get(col).copied()` 跟下面 pread fallback 对齐.regression test `cell_at_off_ring_returns_correct_column`(ram_cap=4 强制 evict 后逐列断言)
