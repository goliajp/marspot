[package]
name = "marspot"
version = "0.2.12"
edition = "2024"
build = "build.rs"
license = "Apache-2.0 OR MIT"
# Private repo — nothing here is published to crates.io.  (Also what
# lets cargo-deny accept the version-less workspace path deps.)
publish = false

[workspace]
members = ["crates/marspot-term", "crates/marspot-session", "crates/marspot-linkify"]
# Without this, a bare `cargo build` builds only the root `marspot`
# package (+ its marspot-term dep) and silently SKIPS marspot-session
# (nothing depends on it) — so iterating on L3 with `cargo build` runs a
# stale session binary. List every member + the root so bare cargo
# commands cover the whole workspace; scripts still pass --workspace.
default-members = [".", "crates/marspot-term", "crates/marspot-session", "crates/marspot-linkify"]

[features]
# Offscreen panel screenshots — `marspot --snapshot out.png --panel X`.
#
# A development tool, and off by default because the shipped binary
# should not carry it: the PNG encoder plus the snapshot path is ~17 KB,
# which is most of the headroom the size gate leaves, and nothing a user
# runs ever calls it.  Build it when you need to look at a panel:
#
#     cargo build --features snapshot --bin marspot
snapshot = []

[dependencies]
# The zero-GUI terminal engine (parser/grid/terminal/pty/shelld/...).
# Extracted (target #4) so a light, Metal-free per-session process (L3)
# can link it without dragging in AppKit/Metal/CoreText. The marspot
# lib re-exports it (`pub use marspot_term::*`) so existing
# `marspot::grid::...` paths keep resolving — see docs/per-session-l3.md.
marspot-term = { path = "crates/marspot-term" }
libc = "0.2"
objc2 = "0.6"
# 0.3 framework crates dropped the "all" feature — the defaults now
# enable every regular binding (306/314 features), the residue being
# gnustep / unstable flags we don't want.
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-metal = "0.3"
core-text = "22.0"
core-graphics = "0.25"
core-foundation = "0.10"
foreign-types = "0.5"
png = "0.18"

[profile.release]
# Fat LTO matters now that we split into a lib + multiple bins (marspot,
# mcli): the render and parser hot paths cross the lib↔bin boundary
# every frame, and `thin` LTO leaves them un-inlined.  Measured
# regression on `bin/bench.sh` jumping from ~1 ms to ~20 ms p99
# render with `thin` after the split; `fat` recovers it.
lto = "fat"
codegen-units = 1
# `strip = "debuginfo"` (was `true` = "symbols") keeps the symbol
# table so `sample` / `samply` profiles produce function-level
# frames.  DWARF debug info is still stripped so the binary stays
# small; we only need the .symtab for stack walks.  Reverting to
# `true` is a one-line change if binary size becomes a hard concern.
strip = "debuginfo"
