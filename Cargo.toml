[package]
name = "marspot"
version = "0.19.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0 OR MIT"
# Private repo — nothing here is published to crates.io.  (Also what
# lets cargo-deny accept the version-less workspace path deps.)
publish = false

[workspace]
members = ["crates/marspot-term", "crates/marspot-session", "crates/marspot-linkify", "crates/marspot-peer", "crates/marspot-json", "crates/marspot-agent", "crates/marspot-adapters", "crates/ui/core"]
# Without this, a bare `cargo build` builds only the root `marspot`
# package (+ its marspot-term dep) and silently SKIPS marspot-session
# (nothing depends on it) — so iterating on L3 with `cargo build` runs a
# stale session binary. List every member + the root so bare cargo
# commands cover the whole workspace; scripts still pass --workspace.
default-members = [".", "crates/marspot-term", "crates/marspot-session", "crates/marspot-linkify", "crates/marspot-peer", "crates/marspot-json", "crates/marspot-agent", "crates/marspot-adapters", "crates/ui/core"]

# Clippy's bar, written down rather than argued about.
#
# Everything not listed is denied in CI.  These three are allowed
# because the codebase disagrees with them on purpose:
#
#   collapsible_if   — most were collapsed into let-chains and read
#                      better for it.  What is left is four levels
#                      deep with a comment on each, and flattening
#                      those into one chain hides which condition the
#                      comment belongs to.
#   too_many_args    — the renderer and the pty-op runner pass their
#                      inputs explicitly instead of bundling them into
#                      a struct, so that what a function reads is
#                      visible at the call site rather than hidden in
#                      a field somebody else set.
#   type_complexity  — the callback and tuple types are spelled out
#                      where they are used; naming them would move the
#                      shape away from the place that has to match it.
[lints]
workspace = true

[workspace.lints.clippy]
# clippy's own suggestion here does not compile: it rewrites
# `chunks_exact(N)` to `as_chunks::<N>()` with a const in type
# position and no braces, which is a syntax error.  Until the lint
# emits something that builds, it has nothing to offer.
chunks_exact_to_as_chunks = "allow"
collapsible_if = "allow"
too_many_arguments = "allow"
type_complexity = "allow"

[features]
# Offscreen panel screenshots — `marspot --snapshot out.png --panel X`.
#
# A development tool, and off by default: the PNG encoder plus the
# snapshot path is ~17 KB that the gate's headless benches in the same
# binary have no use for.  Build it when you need to look at a panel:
#
#     cargo build --features snapshot --bin marspot
snapshot = []

# PTY-path decomposition benches — `marspot --bench pty-raw|pty-drain|
# pty-feed:<corpus>`, plus the reader-thread read/gather counters they
# report.
#
# Off by default: these answer "where does the live pipeline's time
# go", which is a question for whoever is working on it, and the
# reader-thread counters they turn on in marspot-term must not reach
# the shipped binaries.  Build them when decomposing:
#
#     cargo build --features bench-pty --bin marspot
bench-pty = ["marspot-term/bench-pty"]

# Timestamps from a key press to the frame that shows it, written by
# the shell and the core when `MARSPOT_LATENCY_TRACE` names a path, and
# a script of key presses for a sandboxed app (`MARSPOT_KEY_SCRIPT`).
# Without the feature neither exists in the binary: the key and frame
# paths read no clock and test no flag for it.
#
#     cargo build --release --features latency-trace
latency-trace = []

# The updater also trusts a throwaway signing key in a sandbox — see
# the feature of the same name in crates/marspot-term.  Only the
# end-to-end update tests build with it.
test-update-key = ["marspot-term/test-update-key"]

[dependencies]
# The zero-GUI terminal engine (parser/grid/terminal/pty/shelld/...).
# Extracted (target #4) so a light, Metal-free per-session process (L3)
# can link it without dragging in AppKit/Metal/CoreText. The marspot
# lib re-exports it (`pub use marspot_term::*`) so existing
# `marspot::grid::...` paths keep resolving.
marspot-term = { path = "crates/marspot-term" }

# The scene format a backend draws from.  In-tree, ours, zero deps —
# not a third-party dependency, and it carries no reason-to-exist
# comment for that reason.  The renderer reads its published byte
# layout rather than a parallel struct that happens to agree.
golia-ui-core = { path = "crates/ui/core" }

# Session-to-session messaging protocols (Claude Code inbox sockets,
# Codex app-server client).  In-tree, ours, zero deps beyond libc.
marspot-peer = { path = "crates/marspot-peer" }

# What every agent shares, as pure code (account choice and its
# simulator).  In-tree, ours, no deps beyond marspot-term.  Only the
# shell names it.
marspot-agent = { path = "crates/marspot-agent" }
libc = "0.2"
objc2 = "0.6"
# 0.3 framework crates dropped the "all" feature — the defaults now
# enable every regular binding (306/314 features), the residue being
# gnustep / unstable flags we don't want.
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
# AppKit's completion handlers and Metal's finished-frame callback are
# Objective-C blocks, and this is the crate objc2 builds blocks with; it
# is in the tree already through objc2-app-kit and objc2-metal, so
# writing our own block layout is unreasonable.
block2 = "0.6"
objc2-quartz-core = "0.3"
objc2-metal = "0.3"
core-text = "22.0"
core-graphics = "0.25"
core-foundation = "0.10"
foreign-types = "0.5"
png = "0.18"

[dev-dependencies]
# The same engine, with the counting allocator the zero-allocation tests
# of the shell and the core install.  Not in any shipped build.
marspot-term = { path = "crates/marspot-term", features = ["alloc-count"] }
# The per-agent record folds, compared in the shell's tests with the
# readers they will replace.  Not linked into any shipped binary yet.
marspot-adapters = { path = "crates/marspot-adapters" }

[profile.release]
# Fat LTO matters now that we split into a lib + multiple bins: the
# render and parser hot paths cross the lib↔bin boundary
# every frame, and `thin` LTO leaves them un-inlined.  Measured
# regression on `bin/bench.sh` jumping from ~1 ms to ~20 ms p99
# render with `thin` after the split; `fat` recovers it.
lto = "fat"
codegen-units = 1
# `strip = "debuginfo"` (was `true` = "symbols") keeps the symbol
# table so `sample` / `samply` profiles produce function-level
# frames.  DWARF debug info is still stripped so the binary stays
# small; we only need the .symtab for stack walks.  Reverting to
# `true` is a one-line change if binary size becomes a hard concern.
strip = "debuginfo"

[profile.dev]
# debug=1 (line tables) instead of the default 2 (full DWARF). Backtraces keep
# file and line; what is lost is variable inspection in a debugger, which this
# project's workflow does not use. Measured 2026-08-28: target/debug/deps is
# the largest single thing on these machines — 104 GB in smix alone — and the
# debug info is most of it.
debug = 1
# macOS keeps every compilation's `.o` next to the binary and never
# collects them; the pile is what makes a test binary's FIRST exec slow,
# because the system walks the directory it sits in.  Packed writes the
# debug info into its own file instead and leaves no `.o` behind; line
# numbers survive either way.  323 `.o` files were already sitting in
# this project's runner tree.
split-debuginfo = "packed"
