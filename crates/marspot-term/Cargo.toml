[package]
name = "marspot-term"
version = "0.2.12"
edition = "2024"
license = "Apache-2.0 OR MIT"

# The zero-GUI terminal engine: VT/xterm parser, cell grid, bounded
# scrollback, terminal emulator, PTY, shelld client/protocol, and the
# pure key→bytes input mapping. Deliberately depends on NOTHING that
# links AppKit/Metal/CoreText, so a light per-session process (target
# #4's L3) can link it at a ~3–5 MB resident floor. See
# docs/per-session-l3.md.
[dependencies]
libc = "0.2"
# Rotated-log compression. Already transitive via the GUI crate's `png`
# dep, so it costs zero new entries in Cargo.lock. The `logx::rotate`
# path uses GzEncoder to compress sealed `marspot.<ts>.log` files to
# `.log.gz` in a detached thread, giving ~10× disk reduction on the
# bounded structured-log stream.
#
# `compress` is default-on for everyone EXCEPT `marspot-session`, the
# per-pane process whose ~3-5 MB resident floor is the L3 architecture's
# whole point. Session opts out via `default-features = false` in its
# own Cargo.toml; its rotated files stay `.log` (~10× the disk, but a
# single per-pid file rolling under the same cap → bounded all the same,
# and GC still expires them by age). See docs/per-session-l3.md.
flate2 = { version = "1.1", optional = true }

[features]
default = ["compress"]
compress = ["dep:flate2"]
