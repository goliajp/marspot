[package]
name = "marspot-agent"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

# What is common to every agent CLI marspot runs, as pure code: which
# account each pane should be on and the simulator that checks it.
# Reads no file and links nothing that draws: no objc2, no Metal, no
# messaging code.

[dependencies]
# our own std-only reader: a balance cap is read out of an agent's
# rate-limits object.  AgentKind comes from marspot-term
# (default-features = false) once code here names an agent kind.
marspot-json = { path = "../marspot-json" }

[lints]
workspace = true
