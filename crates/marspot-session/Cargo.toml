[package]
name = "marspot-session"
version = "0.2.3"
edition = "2021"
license = "Apache-2.0 OR MIT"

# The per-session L3 process (target #4): parser/terminal only, NO
# Metal/AppKit/CoreText. Depends ONLY on the zero-GUI marspot-term
# engine so it links no GUI frameworks and floors at ~3–5 MB resident.
# Skeleton today (boot + attach shelld + pump → grid); shm grid publish
# + L2↔L3 control channel land in later steps. See docs/per-session-l3.md.

[[bin]]
name = "marspot-session"
path = "src/main.rs"

[dependencies]
marspot-term = { path = "../marspot-term" }

# Dev-only: the L3 echo probe (examples/l3_echo_probe.rs) replicates
# L2's spawn (clear CLOEXEC on the inherited shm + control fds) to drive
# a real marspot-session headlessly. libc is the same FFI binding the
# rest of the workspace already uses — not a runtime dep of the shipped
# binary, which still links zero GUI frameworks.
[dev-dependencies]
libc = "0.2"
