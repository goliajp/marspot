[package]
name = "marspot-session"
version = "0.2.12"
edition = "2021"
license = "Apache-2.0 OR MIT"

# The per-session L3 process (target #4): parser/terminal only, NO
# Metal/AppKit/CoreText. Depends ONLY on the zero-GUI marspot-term
# engine so it links no GUI frameworks and floors at ~3–5 MB resident.
# Skeleton today (boot + attach shelld + pump → grid); shm grid publish
# + L2↔L3 control channel land in later steps. See docs/per-session-l3.md.

[[bin]]
name = "marspot-session"
path = "src/main.rs"

[dependencies]
# Disable marspot-term's `compress` feature so the L3 process doesn't
# link flate2 + miniz_oxide — those are dead weight at ~3-5 MB target
# resident, and the per-pid session log files are bounded by rotate
# count + age regardless of whether the rotated files are gzipped.
marspot-term = { path = "../marspot-term", default-features = false }
# libc — same FFI binding marspot-term and marspot-shelld already use.
# Needed because RFC-003 moves PTY ownership into L3: openpty, ioctl
# TIOCSWINSZ, EIO error checks all live here now. Trivial code size.
libc = "0.2"
# F1+14 — mimalloc as the global allocator.  macOS libmalloc retains
# freed-but-unused pages indefinitely without OS-level pressure,
# which leaves ~50 MB of "MALLOC_LARGE/SMALL (empty)" sitting in
# every L3's RSS after the snapshot restore + bytelog ingest peak.
# mimalloc (Microsoft Research; ~30 kB code) uses `madvise(MADV_FREE)`
# aggressively so freed pages are reclaimed by the kernel within
# seconds.  9 L3 × ~50 MB ≈ 450 MB savings.  Self-build principle
# exception (Cargo.toml justification): writing a high-performance
# allocator is months of work with significant correctness risk;
# mimalloc is the smallest well-audited drop-in for our pattern.
# `default-features = false` skips the optional secure features
# (page guards, etc.) that we don't need.
mimalloc = { version = "0.1", default-features = false }

# Dev-only: the L3 echo probe (examples/l3_echo_probe.rs) replicates
# L2's spawn (clear CLOEXEC on the inherited shm + control fds) to drive
# a real marspot-session headlessly. libc is the same FFI binding the
# rest of the workspace already uses — not a runtime dep of the shipped
# binary, which still links zero GUI frameworks.
[dev-dependencies]
libc = "0.2"
